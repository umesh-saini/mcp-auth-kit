name: Release

# Push a tag like v0.2.0 to publish to npm with provenance.
# Auth: npm trusted publishing (npmjs.com → package → Settings → Trusted publisher → GitHub Actions,
# workflow file "release.yml"). No token needed. An NPM_TOKEN repository secret also works.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
